services:
  redis:
    image: redis:7-alpine
    container_name: ta_emulator_redis
    ports:
      - "${AE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Browser UI for inspecting the recorder's streams. No experiment needs it,
  # so it sits behind a profile: a bare "up -d" starts redis alone, and a
  # failure to pull this image cannot hold up the evaluation.
  #   docker compose -f docker-compose.redis.yml --profile ui up -d
  redis-commander:
    profiles: ["ui"]
    image: rediscommander/redis-commander:latest
    container_name: ta_emulator_redis_ui
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
