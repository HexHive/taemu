services:
  emulator:
    image: ta_emu
    build:
      context: .
      network: host
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - .:/srv
    ulimits:
      core: 0
    working_dir: /srv/emulator
    command: bash
    restart: unless-stopped
    shm_size: 100g
    ipc: host
    privileged: true
    user: root
