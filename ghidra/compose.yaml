services:
  ghidrathon-headless:
    image: ghidrathon:latest
    platform: linux # Native arch
    build:
      context: .
      target: ghidrathon
    environment:
      MAXMEM: ${GHIDRA_MAXMEM:-}
      GHIDRA_MAX_CPU: ${GHIDRA_MAX_CPU:-}
    volumes:
      - ./src:/src:ro
      - ../mitee/tas/:/mitee_tas/:rw
      - ../beanpod/tas:/beanpod_tas/:rw
      - ../teegris/tas:/teegris_tas/:rw
      - ../t6/tas:/t6_tas/:rw
      - ../optee/tas:/optee_tas/:rw
      - ../qsee_nongp/tas:/qsee_nongp_tas/:rw
      - ..:/mnt:rw
      - ../qsee/tas:/qsee_tas/:rw
      - ../kinibi/tas:/kinibi_tas/:rw
      - ./docker/mitee-entrypoint.sh:/mitee-entrypoint.sh
      - ./docker/beanpod-entrypoint.sh:/beanpod-entrypoint.sh
      - ./docker/teegris-entrypoint.sh:/teegris-entrypoint.sh
      - ./docker/t6-entrypoint.sh:/t6-entrypoint.sh
      - ./docker/qsee-entrypoint.sh:/qsee-entrypoint.sh
      - ./docker/optee-entrypoint.sh:/optee-entrypoint.sh
      - ./docker/bbs-entrypoint.sh:/bbs-entrypoint.sh
      - ./docker/bbs-manual-entrypoint.sh:/bbs-manual-entrypoint.sh
      - ./docker/qsee-nongp-entrypoint.sh:/qsee-nongp-entrypoint.sh
    deploy:
      replicas: 0 # Don't start ghidrathon by default
  tipi:
    extends: # Use env, volumes, capabilities from above service
      service: ghidrathon-headless
