services:
  ghidrathon-headless:
    image: ghidrathon:latest
    platform: linux # Native arch
    build:
      context: .
      target: ghidrathon
    volumes:
      - ./src:/src:ro
      - ../mitee/tas:/mitee_tas/:rw
      - ../beanpod/tas:/beanpod_tas/:rw
      - ../teegris/tas:/teegris_tas/:rw
      - ./docker/mitee-entrypoint.sh:/mitee-entrypoint.sh
      - ./docker/beanpod-entrypoint.sh:/beanpod-entrypoint.sh
      - ./docker/teegris-entrypoint.sh:/teegris-entrypoint.sh
    deploy:
      replicas: 0 # Don't start ghidrathon by default
  tipi:
    extends: # Use env, volumes, capabilities from above service
      service: ghidrathon-headless
