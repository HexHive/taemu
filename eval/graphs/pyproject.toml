[project]
name = "graphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cachetools>=6.2.4",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]


[tool.ruff.lint]
select = ["F", "I"]  # F includes F401 unused imports; I is import sorting
fixable = ["ALL"]


[tool.pytest.ini_options]
pythonpath = ["."]
