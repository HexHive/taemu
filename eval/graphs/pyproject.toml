[project]
name = "graphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ruff>=0.14.13",
]


[tool.ruff.lint]
select = ["F", "I"]  # F includes F401 unused imports; I is import sorting
fixable = ["ALL"]